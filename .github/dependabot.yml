# Mises à jour de dépendances (version updates). Les alertes et correctifs de sécurité (security updates)
# s'activent en plus dans Settings → Code security → Dependabot.
#
# Principes communs aux trois écosystèmes :
# - PR vers `dev` (jamais `master` directement), validées par la CI et CodeQL comme toute PR ;
# - mineures et correctifs groupés en une PR par écosystème ; les majeures restent isolées (changements cassants) ;
# - délai de carence (cooldown) : on laisse une version « refroidir » quelques jours avant de la proposer. La plupart
#   des paquets piégés publiés sur npm/PyPI sont repérés et retirés dans ce délai ;
# - messages au format Conventional Commits (`build(deps): …`).
version: 2

updates:
  # Monorepo pnpm : la racine couvre tous les workspaces (apps/api, apps/web) via pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    open-pull-requests-limit: 10

  # Worker Python : lu depuis pyproject.toml + uv.lock.
  - package-ecosystem: uv
    directory: /apps/scraper
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    open-pull-requests-limit: 5

  # Actions des workflows : `directory: /` est la convention GitHub, Dependabot y lit .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci(deps)
