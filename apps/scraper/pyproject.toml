[project]
name = "manhwa-scraper"
version = "0.1.0"
description = "Worker de scraping des sites de scantrad, alimente l'API Hono via /api/ingest"
authors = [
    { name = "zogeek", email = "91289024+zogeek@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "camoufox[geoip]>=0.5.6",
    "curl-cffi>=0.16.3",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "selectolax>=0.4.12",
    "tenacity>=9.1.4",
]

[project.scripts]
manhwa-scraper = "manhwa_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.83.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py313"
# Généré depuis le contrat Zod de l'API (`pnpm contract:generate`) : on ne le lint pas, on le régénère.
extend-exclude = ["src/manhwa_scraper/contract.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "PT", "RUF", "C4", "PIE", "RET", "TC"]
# Docstrings et messages en français : les caractères « » ’ … sont voulus.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

# Modèles Pydantic générés depuis le JSON Schema exporté par l'API (source unique : les validateurs Zod).
# `uv run datamodel-codegen` (ou `pnpm contract:generate` à la racine) lit cette section.
[tool.datamodel-codegen]
input = "../api/contracts/ingestion.schema.json"
input-file-type = "jsonschema"
output = "src/manhwa_scraper/contract.py"
output-model-type = "pydantic_v2.BaseModel"
base-class = "manhwa_scraper.contract_base.ContractModel"
target-python-version = "3.13"
use-annotated = true
field-constraints = true
snake-case-field = true
use-standard-collections = true
use-union-operator = true
enum-field-as-literal = "none"
use-subclass-enum = true
use-type-alias = true
collapse-root-models = true
output-datetime-class = "AwareDatetime"
use-double-quotes = true
disable-timestamp = true
strict-nullable = true
formatters = ["ruff-format"]
custom-file-header = """# FICHIER GÉNÉRÉ — ne pas éditer.
# Source : validateurs Zod de apps/api/src/modules/ingestion/ingestion.validator.ts
#   → apps/api/contracts/ingestion.schema.json → datamodel-codegen.
# Régénérer : `pnpm contract:generate` à la racine du monorepo."""
